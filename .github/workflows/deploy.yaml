name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'alloy/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy AWS Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

       # Login no ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

            # Build e publicação da imagem Alloy
      - name: Build and Push Alloy Image
        run: |
          docker build \
            -f alloy/Dockerfile \
            -t projeto-observabilidade-alloy:latest \
            .

          docker tag projeto-observabilidade-alloy:latest \
            ${{ steps.login-ecr.outputs.registry }}/projeto-observabilidade-alloy:latest

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/projeto-observabilidade-alloy:latest
        working-directory: .

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate
     
      - name: Terraform Plan
        run: terraform plan
        env:
          TF_VAR_grafana_secret_arn: ${{ vars.TF_VAR_grafana_secret_arn }}

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve
        env:
          TF_VAR_grafana_secret_arn: ${{ vars.TF_VAR_grafana_secret_arn }}

