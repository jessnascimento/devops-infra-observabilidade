
name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply immediately after planning (review a plan-only run first)
        type: boolean
        default: false
      enable_https:
        description: Enable HTTPS after the ACM certificate is issued
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

# Impede duas execuções simultâneas modificando o mesmo estado
concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy AWS Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      # Checkout do repositório principal
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configuração AWS via OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # Login no ECR
      - name: Login to Amazon ECR
        if: inputs.apply && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build e publicação da imagem Alloy
      - name: Build and Push Alloy Image
        if: inputs.apply && github.ref == 'refs/heads/main'
        run: |
          docker build \
            -f alloy/Dockerfile \
            -t projeto-observabilidade-alloy:latest \
            .

          docker tag projeto-observabilidade-alloy:latest \
            ${{ steps.login-ecr.outputs.registry }}/projeto-observabilidade-alloy:latest

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/projeto-observabilidade-alloy:latest
        working-directory: .

      # Configuração Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
        env:
          TF_VAR_grafana_secret_arn: ${{ vars.TF_VAR_grafana_secret_arn }}
          TF_VAR_hosted_zone_id: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}
          TF_VAR_app_hostname: ${{ vars.APP_HOSTNAME }}
          TF_VAR_enable_https: ${{ inputs.enable_https }}
          TF_VAR_health_check_path: ${{ vars.HEALTH_CHECK_PATH || '/' }}

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && inputs.apply
        run: terraform apply -input=false tfplan
        env:
          TF_VAR_grafana_secret_arn: ${{ vars.TF_VAR_grafana_secret_arn }}
          TF_VAR_hosted_zone_id: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}
          TF_VAR_app_hostname: ${{ vars.APP_HOSTNAME }}
          TF_VAR_enable_https: ${{ inputs.enable_https }}
          TF_VAR_health_check_path: ${{ vars.HEALTH_CHECK_PATH || '/' }}
