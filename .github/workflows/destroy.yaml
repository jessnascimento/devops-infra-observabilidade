
name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite DESTROY para confirmar a exclusão da infraestrutura'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

# Evita conflito com o workflow de deploy
concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy AWS Infrastructure
    runs-on: ubuntu-latest

    # Só permite executar na main com confirmação explícita
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DESTROY'

    defaults:
      run:
        working-directory: terraform

    env:
      TF_VAR_grafana_secret_arn: ${{ vars.TF_VAR_grafana_secret_arn }}
      TF_VAR_hosted_zone_id: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}
      TF_VAR_app_hostname: ${{ vars.APP_HOSTNAME }}
      TF_VAR_enable_https: "false"
      TF_VAR_health_check_path: ${{ vars.HEALTH_CHECK_PATH || '/' }}

    steps:
      # Checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # Autenticação AWS via OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # Instala Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      # Verifica formatação
      - name: Terraform Format
        run: terraform fmt -check -recursive

      # Inicializa o backend remoto
      - name: Terraform Init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # Valida configuração
      - name: Terraform Validate
        run: terraform validate

      # Cria plano de destruição
      - name: Terraform Destroy Plan
        run: terraform plan -destroy -input=false -out=tfplan

      # Executa destruição
      - name: Terraform Destroy Apply
        run: terraform apply -input=false -auto-approve tfplan
